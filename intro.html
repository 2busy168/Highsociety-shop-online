<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>GEN Z TERPZ Intro</title>
<link rel="icon" type="image/png" href="assets/genz-terpz-logo.png" />
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&family=Bangers&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet" />
<!--
  Feature intro สำหรับหน้าร้าน — แอนิเมชันทั้งหมดคำนวณจากเวลา (pure function ของ t)
  เพลงสังเคราะห์สดด้วย WebAudio ที่ 160 BPM ภาพซิงก์กับนาฬิกาของเสียง
  รีวิวทีละเฟรม: intro.html?t=12.5 (วินาที) หรือ ?b=34 (บีต) | เล่นไม่มีเสียง: ?autoplay | แนวตั้ง 9:16: ?v
  คีย์ลัด: Space หยุด/เล่น, ←/→ ทีละเฟรม (Shift = ทีละบีต), D = debug, M = ปิดเสียง
-->
<style>
  :root{
    --pink:#ff2d78; --orange:#ff8a00; --yellow:#ffe600; --green:#3ddc84; --cyan:#00c2ff; --purple:#a259ff;
    --ink:#07070b; --leaf:#047857; --neon:#00ff88;
    --rainbow:linear-gradient(115deg,#ff2d78 0%,#ff8a00 20%,#ffe600 40%,#3ddc84 60%,#00c2ff 80%,#a259ff 100%);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:#000; overflow:hidden; font-family:'Kanit',sans-serif; color:#fff; }
  #stage{ position:absolute; left:0; top:0; width:1920px; height:1080px; overflow:hidden; background:var(--ink); transform-origin:0 0; }
  #lens{ position:absolute; inset:0; }
  #world{ position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform; }
  #world-bg{ position:absolute; left:-3000px; top:-3000px; width:16880px; height:9880px;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 2px, transparent 2px 160px),
      repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 2px, transparent 2px 160px),
      radial-gradient(circle at 50% 50%, #1a1030 0%, #07070b 60%); }
  .panel{ position:absolute; width:1920px; height:1080px; overflow:hidden; border-radius:36px;
    box-shadow:0 0 0 8px rgba(255,255,255,.07), 0 60px 160px rgba(0,0,0,.7); }
  .plabel{ position:absolute; font-family:'Bangers',Impact,sans-serif; font-size:170px; letter-spacing:.04em; color:transparent;
    -webkit-text-stroke:3px rgba(255,255,255,.22); white-space:nowrap; }
  .abs{ position:absolute; }
  [data-fx]{ opacity:0; }
  .graffiti{ font-family:'Bangers',Impact,'Kanit',sans-serif; letter-spacing:.04em; -webkit-text-stroke:5px #000; paint-order:stroke fill; text-shadow:10px 10px 0 #000; }
  .center-x{ left:0; width:1920px; text-align:center; }

  /* ===== mock UI (โทนเดียวกับหน้าร้าน) ===== */
  .card{ background:#fff; color:#1f2937; border-radius:28px; box-shadow:0 24px 60px rgba(0,0,0,.35); }
  .chip{ border-radius:999px; background:#ecfdf5; color:#1f2937; font-weight:600; font-size:40px; display:flex; align-items:center; justify-content:center; gap:14px; box-shadow:0 8px 20px rgba(0,0,0,.18); }
  .chip.active{ background:#3ddc84; color:#000; box-shadow:0 0 0 8px #fff, 0 24px 50px rgba(61,220,132,.7); }
  .btn{ background:#16a34a; color:#fff; border-radius:20px; font-weight:700; display:flex; align-items:center; justify-content:center; box-shadow:0 10px 0 #14532d; }
  .btn.pressed{ background:#15803d; box-shadow:0 2px 0 #14532d; margin-top:8px; }
  .tag{ border-radius:999px; padding:6px 24px; font-weight:600; display:inline-flex; align-items:center; gap:10px; }
  .t-indica{ background:#f3e8ff; color:#6b21a8; } .t-sativa{ background:#fef9c3; color:#854d0e; } .t-hybrid{ background:#dcfce7; color:#166534; }
  .h-title{ font-weight:700; font-size:76px; line-height:1.15; }
  .bud{ border-radius:24px; overflow:hidden; position:relative;
    background:
      radial-gradient(circle at 30% 35%, #a3e635 0 12%, transparent 13%),
      radial-gradient(circle at 62% 30%, #84cc16 0 14%, transparent 15%),
      radial-gradient(circle at 48% 58%, #65a30d 0 18%, transparent 19%),
      radial-gradient(circle at 70% 66%, #7c3aed 0 10%, transparent 11%),
      radial-gradient(circle at 32% 70%, #a855f7 0 9%, transparent 10%),
      radial-gradient(circle at 50% 50%, #14532d, #052e16); }
  .bud::after{ content:""; position:absolute; inset:0; background:radial-gradient(circle at 40% 30%, rgba(255,255,255,.35), transparent 45%); }

  .mini{ position:absolute; width:300px; height:150px; border-radius:22px; background:#fff; color:#111; box-shadow:0 10px 24px rgba(0,0,0,.15); overflow:hidden; }
  .mini .band{ height:56px; }
  .mini .nm{ font-size:28px; font-weight:700; padding:6px 18px 0; white-space:nowrap; }
  .mini .pr{ font-size:26px; font-weight:600; color:#047857; padding:0 18px; }
  .mini .pr s{ color:#9ca3af; font-weight:400; margin-right:8px; }
  .mini .pr b{ color:#dc2626; }

  /* admin (ธีมเดียวกับ admin.html) */
  .adm{ background:#0a0a0a; color:#f0f0f0; }
  .adm .surface{ background:#111; border:2px solid #2a2a2a; border-radius:22px; }
  .mono{ font-family:'IBM Plex Mono',monospace; }
  .neon{ color:#00ff88; }
  .pill{ border-radius:999px; padding:8px 26px; font-weight:600; display:inline-flex; align-items:center; gap:10px; }
  .pill.pending{ background:rgba(255,204,0,.12); color:#ffcc00; border:2px solid #ffcc00; }
  .pill.paid{ background:rgba(0,255,136,.12); color:#00ff88; border:2px solid #00ff88; }
  .abtn{ border-radius:14px; background:#1a1a1a; border:2px solid #2a2a2a; color:#f0f0f0; font-weight:600; display:flex; align-items:center; justify-content:center; font-size:30px; }
  .abtn.primary{ background:#00ff88; color:#000; border-color:#00ff88; }
  .abtn.pressed{ background:#00ff88; color:#000; border-color:#00ff88; box-shadow:0 0 40px rgba(0,255,136,.6); }
  .acard.hiddenp{ opacity:.4; filter:grayscale(1); }
  .acard .img{ height:220px; border-radius:18px 18px 0 0; }
  .acard.newimg .img{ background:linear-gradient(135deg,#ff2d78,#ffe600) !important; }

  /* HUD caption */
  #hud{ position:absolute; left:70px; bottom:64px; pointer-events:none; }
  #cap-kick{ display:inline-block; font-family:'Bangers',Impact,sans-serif; font-size:38px; letter-spacing:.08em; color:#000; background:var(--rainbow); padding:6px 22px 2px; border-radius:10px; margin-bottom:14px; }
  #cap-band{ position:relative; padding:14px 44px 20px 30px; background:#000; transform:skewX(-8deg); border-left:14px solid var(--green); box-shadow:0 20px 40px rgba(0,0,0,.5); }
  #cap-text{ display:block; transform:skewX(8deg); font-weight:800; font-size:68px; line-height:1.15; white-space:nowrap; }
  #flash{ position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; mix-blend-mode:screen; }
  #vignette{ position:absolute; inset:0; pointer-events:none; background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%); }
  #progress{ position:absolute; left:0; bottom:0; height:8px; width:0; background:var(--rainbow); }
  #endfade{ position:absolute; inset:0; background:#000; opacity:0; pointer-events:none; }
  #debug{ position:absolute; right:20px; top:20px; font:600 28px 'IBM Plex Mono',monospace; background:rgba(0,0,0,.7); padding:10px 18px; border-radius:10px; display:none; }

  /* gate / end */
  .overlay{ position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; background:#07070b; z-index:10; text-align:center; padding:16px; }
  .overlay.hidden{ display:none; }
  .play{ font-family:'Bangers',Impact,sans-serif; font-size:44px; letter-spacing:.06em; color:#000; background:var(--rainbow); border:0; border-radius:999px; padding:18px 56px 12px; cursor:pointer; box-shadow:0 0 0 6px #000, 0 0 0 10px #fff; }
  .play:focus-visible{ outline:4px solid #fff; outline-offset:10px; }
  .sub{ color:#9ca3af; font-size:16px; }
  #rotate-hint{ position:fixed; left:50%; bottom:16px; transform:translateX(-50%); font-size:14px; color:#9ca3af; display:none; z-index:5; }
  @media (orientation:portrait){ #rotate-hint{ display:block; } }
  /* แนวตั้ง 9:16 — เว้นขอบบน ~220px และล่าง ~420px ให้พ้น UI ของ Reels/TikTok */
  .v .panel{ width:1080px; height:1920px; }
  .v .center-x{ width:1080px; }
  .v .plabel{ font-size:120px; }
  .v #hud{ left:50px; right:110px; bottom:330px; }
  .v #cap-kick{ font-size:34px; }
  .v #cap-text{ white-space:normal; font-size:58px; }
  .v #rotate-hint{ display:none !important; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="mb" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
    <feGaussianBlur id="mb-blur" in="SourceGraphic" stdDeviation="0 0" />
  </filter>
</svg>

<div id="stage">
  <div id="lens"><div id="world"><div id="world-bg"></div></div></div>
  <div id="vignette"></div>
  <div id="hud" aria-live="polite"><div id="cap-kick"></div><br><div id="cap-band"><span id="cap-text"></span></div></div>
  <div id="flash"></div>
  <div id="endfade"></div>
  <div id="progress"></div>
  <div id="debug"></div>
</div>

<div id="gate" class="overlay">
  <img src="assets/genz-terpz-logo.png" alt="GEN Z TERPZ" style="width:min(260px,50vw)">
  <button id="play-btn" class="play">▶ PLAY INTRO</button>
  <div class="sub">เปิดเสียงเพื่อประสบการณ์เต็ม · ~53 วินาที</div>
</div>
<div id="end" class="overlay hidden">
  <img src="assets/genz-terpz-logo.png" alt="GEN Z TERPZ" style="width:min(220px,45vw)">
  <button id="replay-btn" class="play">↻ REPLAY</button>
  <a href="index.html" class="sub" style="color:#3ddc84;font-size:18px">เข้าสู่ร้าน →</a>
</div>
<div id="rotate-hint">หมุนจอแนวนอนเพื่อดูเต็มจอ ↻</div>

<script>
/* ================= TIMING ================= */
const BPM = 160, B = 60 / BPM;          // 1 บีต = 0.375 วินาที
const END_BEAT = 140;                   // จบเพลง/ภาพที่บีต 140 (~52.5s)
const sec = b => b * B;

/* ================= WORLD LAYOUT ================= */
// แต่ละฉากเป็น panel บน "โลก" ขนาดใหญ่ กล้องวิ่งไปมาระหว่าง panel (เดินแบบงู ซ้าย→ขวา, ขวา→ซ้าย)
const params=new URLSearchParams(location.search);
// ?v หรือ #vertical = เวอร์ชันแนวตั้ง 9:16 (Reels / TikTok) — จังหวะ เพลง คำบรรยายเหมือนเดิม จัดเลย์เอาต์ใหม่ทุกฉาก
const V = params.has('v') || location.hash==='#vertical';
const SW = V?1080:1920, SH = V?1920:1080;
if (V) document.documentElement.classList.add('v');
const PX = V?1300:2240, PY = V?2200:1400;
const GRID = [[0,0],[1,0],[2,0],[3,0],[4,0],[4,1],[3,1],[2,1],[1,1],[0,1],[0,2],[1,2],[2,2],[3,2],[4,2]];
const WORLD_CENTER = { x:(4*PX+SW)/2, y:(2*PY+SH)/2 };
const panelCenter = i => ({ x: GRID[i][0]*PX + SW/2, y: GRID[i][1]*PY + SH/2 });

/* ---------- helpers สร้าง HTML ---------- */
const P = (x,y,w,h) => `left:${x}px;top:${y}px;` + (w!=null?`width:${w}px;`:'') + (h!=null?`height:${h}px;`:'');
// fx: ชื่อเอฟเฟกต์, b: บีตที่เข้า, o: {d: ความยาว(บีต), out: บีตที่ออก, rot, ...data}
function F(fx, b, o={}){
  let s = ` data-fx="${fx}" data-in="${b}"`;
  for (const k in o) s += ` data-${k}="${o[k]}"`;
  return s;
}
const SEQ = arr => ` data-seq='${JSON.stringify(arr)}'`;

/* ================= PANELS ================= */
const PANELS = [];

// 0 — LOGO SLAM (hook ในวินาทีแรก)
PANELS.push(`
  <div class="abs" style="${P(-440,-860,2800,2800)};background:conic-gradient(from 0deg,#ff2d78,#ff8a00,#ffe600,#3ddc84,#00c2ff,#a259ff,#ff2d78);border-radius:50%" ${F('spin',-9,{speed:9})}></div>
  <div class="abs" style="${P(0,0,1920,1080)};background:radial-gradient(circle at 50% 38%, rgba(255,255,255,.95) 0 22%, rgba(255,255,255,0) 42%)"></div>
  <img class="abs" src="assets/genz-terpz-logo.png" alt="" style="${P(700,30,520,520)}" ${F('slam',0,{d:.35})}>
  <div class="abs graffiti center-x" style="top:520px;font-size:190px;color:#fff" ${F('slam',2,{d:.35})}>HIGHSOCIETY</div>
  <div class="abs center-x" style="top:790px" ${F('fromB',3,{d:.6})}><span style="display:inline-block;background:#000;padding:8px 44px 16px;border-radius:20px;font-size:76px;font-weight:800">ช้อปสายเขียว ครบในมือถือ</span></div>
`);

// 1 — FEEL FINDER
{
  const feel = [[['🌿','ดูหนัง'],['🌿','ฟังเพลง'],['🌿','เล่นเกม']],[['😴','ลดเครียด'],['😴','นอนไม่หลับ']],[['⚡','มีสมาธิ'],['⚡','ไอเดียใหม่'],['⚡','ปาร์ตี้']]];
  let chips='', i=0;
  feel.forEach((row,r)=>row.forEach((f,c)=>{
    const isParty = f[1]==='ปาร์ตี้';
    chips += `<div class="abs chip" style="${P(110+c*310,250+r*140,290,108)}" ${F('pop',8.25+i*0.5)} ${isParty?'data-cls="active@13"':''}><span>${f[0]}</span>${f[1]}</div>`;
    i++;
  }));
  const picks=[['Sour Diesel','~22%'],['Jack Herer','~20%'],['Super Lemon Haze','~21%']];
  PANELS.push(`
    <div class="abs" style="${P(0,0,1920,1080)};background:radial-gradient(circle at 20% 20%,#065f46,#022c22 55%,#07070b)"></div>
    <div class="abs" style="${P(0,0,1920,14)};background:var(--rainbow)"></div>
    <div class="abs h-title" style="${P(110,80)}" ${F('fromR',7.7)}>คุณต้องการความรู้สึกแบบไหน?</div>
    ${chips}
    <div class="abs" style="${P(1035,676,130,14)};background:#3ddc84;border-radius:8px;transform-origin:left" ${F('fillx',14,{d:.6})}></div>
    <div class="abs card" style="${P(1180,250,640,560)}" ${F('fromR',15)}>
      <div style="padding:34px 40px 10px"><span class="tag t-sativa" style="font-size:34px">⚡ Sativa</span></div>
      <div style="padding:0 40px;font-size:50px;font-weight:700;color:#047857">สายพันธุ์สำหรับ "ปาร์ตี้"</div>
      ${picks.map((p,k)=>`<div class="abs" style="${P(40,220+k*104,560,88)};background:#f0fdf4;border-radius:18px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:34px;font-weight:600" ${F('fromR',15.5+k*0.5)}><span>${p[0]}</span><span style="color:#854d0e">THC ${p[1]}</span></div>`).join('')}
    </div>
  `);
}

// 2 — SMART SORT (% Indica/Sativa)
PANELS.push(`
  <div class="abs" style="${P(0,0,1920,1080)};background:radial-gradient(circle at 70% 10%,#4c1d95,#1e0b3a 50%,#07070b)"></div>
  <div class="abs h-title" style="${P(160,70)}" ${F('fromR',19.7)}>จัดกลุ่มอัตโนมัติ</div>
  <div class="abs card" style="${P(160,200,1000,330)}" ${F('fromR',19.85)}>
    <div style="padding:30px 44px 0;font-size:60px;font-weight:700;color:#047857">Purple Punch</div>
    <div class="abs" style="${P(44,140,912,76)};background:#fde047;border-radius:40px;overflow:hidden">
      <div class="abs" style="${P(0,0,657,76)};background:#7c3aed;transform-origin:left" ${F('fillx',21,{d:2})}></div>
    </div>
    <div class="abs" style="${P(44,236)};font-size:40px;font-weight:700;color:#6b21a8">Indica <span data-count="21,2,72" data-suf="%"></span></div>
    <div class="abs" style="${P(700,236,256)};text-align:right;font-size:40px;font-weight:700;color:#854d0e">Sativa <span data-count="21,2,28" data-suf="%"></span></div>
  </div>
  <div class="abs" style="${P(1250,270)}" ${F('slam',24,{rot:-6})}><span class="tag t-indica" style="font-size:80px;padding:14px 48px;box-shadow:0 20px 50px rgba(0,0,0,.5)">😴 Indica</span></div>
  <div class="abs" style="${P(160,560)};font-size:36px;color:#c4b5fd" ${F('fade',22.5)}>Indica ≥ 60% → Indica · ต่างกันไม่เกิน 20% → Hybrid</div>
  ${[['😴 Indica','t-indica'],['⚡ Sativa','t-sativa'],['🌿 Hybrid','t-hybrid']].map((g,k)=>`
    <div class="abs ${g[1]}" style="${P(160+k*560,640,500,190)};border-radius:28px;display:flex;align-items:center;justify-content:center;font-size:62px;font-weight:700;${k===0?'':'opacity:.85'}" ${F('fromB',22+k*0.5)} ${k===0?'data-cls="glow@25"':''}>${g[0]}</div>`).join('')}
  <div class="abs" style="${P(470,610)};background:#16a34a;color:#fff;font-size:40px;font-weight:700;padding:6px 22px;border-radius:999px" ${F('pop',25)}>+1</div>
  <style>.glow{ box-shadow:0 0 0 10px #a259ff, 0 0 80px #a259ff; }</style>
`);

// 3 — CATALOG 5 หมวด
{
  const cats=[['🌿','สายพันธุ์','Indica · Sativa · Hybrid','#16a34a'],['🚬','Pre-Roll','พร้อมสูบ','#ea580c'],['🎁','Combo Pack','คุ้มกว่า','#db2777'],['💨','Vape','หลายแบรนด์','#0284c7'],['⚙️','อุปกรณ์','ครบทุกชิ้น','#4b5563']];
  PANELS.push(`
    <div class="abs" style="${P(0,0,1920,1080)};background:linear-gradient(160deg,#111827,#07070b)"></div>
    <div class="abs h-title" style="${P(110,60)}" ${F('fromR',33)}>เลือกได้ทุกหมวด</div>
    ${cats.map((c,k)=>`
      <div class="abs" style="${P(110+k*350,200,320,560)};border-radius:32px;background:linear-gradient(170deg,${c[3]},#000);border:6px solid rgba(255,255,255,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px" ${F('fromB',k?28+k:27.75,{d:.5})}>
        <div style="font-size:150px;line-height:1">${c[0]}</div>
        <div style="font-size:54px;font-weight:800">${c[1]}</div>
        <div style="font-size:30px;opacity:.85">${c[2]}</div>
      </div>`).join('')}
  `);
}

// 4 — HOME FEED (แถวเลื่อนแนวนอน)
{
  const rows=[['🔥 โปรโมชั่นประจำเดือน','#ff2d78',true],['⭐ สินค้าแนะนำ','#ffe600',false],['💰 Budget Selection','#3ddc84',false],['🎯 Limited Offer','#a259ff',false]];
  const names=['Purple Punch','Gelato 41','OG Kush','Blue Dream','Zkittlez','Wedding Cake','Runtz','Gorilla Glue','Sour Diesel','Jack Herer'];
  let html=`<div class="abs" style="${P(0,0,1920,1080)};background:#f3f4f6"></div>`;
  rows.forEach((r,k)=>{
    const y=40+k*205, b=36+k*2;
    let cards='';
    for(let j=0;j<10;j++){
      const nm=names[(j+k*3)%names.length];
      const price = r[2] ? `<s>฿${450+j*10}</s><b>฿${390+j*10}</b>` : `฿${[190,250,290,390,450][(j+k)%5]}`;
      cards+=`<div class="mini" style="left:${j*330}px;top:0"><div class="band" style="background:linear-gradient(90deg,${r[1]},#047857)"></div><div class="nm">${nm}</div><div class="pr">${price}</div></div>`;
    }
    html+=`<div class="abs" style="${P(70,y)};font-size:50px;font-weight:700;color:#111" ${F('fromR',b-0.35)}>${r[0]}</div>`;
    html+=`<div class="abs" style="${P(70,y+68,3400,150)}" ${F('scroll',b-0.2,{speed:28*(k%2?-1:1)})}>${cards}</div>`;
  });
  PANELS.push(html);
}

// 5 — PRODUCT CARD
PANELS.push(`
  <div class="abs" style="${P(0,0,1920,1080)};background:linear-gradient(150deg,#065f46,#022c22 60%,#07070b)"></div>

const clamp = (v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const EASE = {
  lin: u=>u,
  sine: u=>0.5-0.5*Math.cos(Math.PI*u),
  whip: u=> u<=0?0:u>=1?1: u<.5 ? Math.pow(2,20*u-10)/2 : (2-Math.pow(2,-20*u+10))/2,
  snap: u=>1-Math.pow(1-u,5),
  ramp: u=>u+0.9*Math.sin(2*Math.PI*u)/(2*Math.PI),
};
const expoOut = u=> u>=1?1:1-Math.pow(2,-10*u);
const backOut = u=>{ const c1=1.9,c3=c1+1; return 1+c3*Math.pow(u-1,3)+c1*Math.pow(u-1,2); };

/* ================= CAMERA EVAL ================= */
function camBase(bt){
  if (bt<=KEYS[0].b) return {...KEYS[0], seg:null, u:0};
  for (let i=0;i<KEYS.length-1;i++){
    const a=KEYS[i], z=KEYS[i+1];
    if (bt<z.b){
      const u=(bt-a.b)/(z.b-a.b), e=EASE[z.e](u);
      const c={ x:a.x+(z.x-a.x)*e, y:a.y+(z.y-a.y)*e, s:Math.exp(Math.log(a.s)+(Math.log(z.s)-Math.log(a.s))*e), r:a.r+(z.r-a.r)*e, seg:z.e, u };
      if (z.e==='whip'){ // เอียงตามทิศ + ถอยกล้องเล็กน้อยกลางทาง ให้ whip มีน้ำหนัก
        const dir=Math.sign((z.x-a.x)||(z.y-a.y)), bell=Math.sin(Math.PI*u);
        c.r += dir*5*bell; c.s *= 1-0.12*bell;
      }
      return c;
    }
  }
  return {...KEYS[KEYS.length-1], seg:null, u:1};
}
function punchAt(bt){
  let m=1;
  for (const [b,a] of PUNCH){ const d=bt-b; if(d>=0&&d<1.5) m*=1+a*Math.exp(-d*B*14); }
  // ชีพจรเบาๆ ทุกบีต (กล้องเต้นตาม kick) ยกเว้นช่วง breakdown
  if (bt>=0 && !(bt>=124&&bt<130) && bt<END_BEAT){ const d=bt-Math.floor(bt); m*=1+0.012*Math.exp(-d*B*18); }
  return m;
}
function cam(bt){ const c=camBase(bt); c.s*=punchAt(bt); return c; }

    case 'slam': s=1+2.4*(1-expoOut(p)); o=clamp(p*8); break;
    case 'pop': s=0.3+0.7*backOut(p); o=clamp(p*5); break;
    case 'fromL': x=-360*(1-expoOut(p)); o=clamp(p*4); break;
    case 'fromR': x= 360*(1-expoOut(p)); o=clamp(p*4); break;
    case 'fromB': y= 240*(1-expoOut(p)); o=clamp(p*4); break;
    case 'fromT': y=-240*(1-expoOut(p)); o=clamp(p*4); break;
    case 'fade': o=p; break;
    case 'grow': sy=expoOut(p); break;
    case 'fillx': sx=expoOut(p); break;
    case 'spin': rot+=bt*it.speed; break;
    case 'blink': o=(Math.floor(bt)%2)?.25:1; break;
    case 'scroll': x=600*(1-expoOut(p)) - (bt-it.tin)*it.speed; o=clamp(p*4); break;
    case 'scan': y=it.h*EASE.sine(p); o= p>=1 ? clamp(1-(bt-it.tin-it.dur)*3) : 1; break;
    case 'iris': clip=`circle(${(expoOut(p)*2300).toFixed(1)}px at ${it.cx}px ${it.cy}px)`; break;
  }
  if (it.out!=null && bt>=it.out){ const q=clamp((bt-it.out)/.3); o*=1-q; s*=1-.1*q; }
  return { o, tf:`translate(${x.toFixed(1)}px,${y.toFixed(1)}px) rotate(${rot.toFixed(2)}deg) scale(${(s*sx).toFixed(4)},${(s*sy).toFixed(4)})`, clip };
}
function updateItem(it,bt){
  if (it.fx){
    const st=fxState(it,bt);
    setIf(it,'o',st.o.toFixed(3),v=>{ it.el.style.opacity=v; it.el.style.visibility=(+v>0)?'visible':'hidden'; });
    if (st.tf) setIf(it,'tf',st.tf,v=>it.el.style.transform=v);
    if (it.fx==='iris') setIf(it,'clip',st.clip||'circle(0px at 0 0)',v=>{ it.el.style.clipPath=v; it.el.style.webkitClipPath=v; });
  }
  if (it.seq){ let txt=it.seq[0][1]; for(const [b,t] of it.seq) if(bt>=b) txt=t; setIf(it,'seq',txt,v=>it.el.textContent=v); }
  if (it.cls){ const st={}; for(const c of it.cls){ if(bt>=c.b) st[c.c]=c.on; else if(!(c.c in st)) st[c.c]=false; }
    for (const c in st) setIf(it,'c_'+c,st[c],v=>it.el.classList.toggle(c,v)); }
  if (it.type){ const n=bt<it.type.b?0:Math.min(it.type.g.length,Math.floor((bt-it.type.b)/it.type.r)+1); setIf(it,'ty',n,v=>it.el.textContent=it.type.g.slice(0,v).join('')); }
  if (it.count){ const p=clamp((bt-it.count.b)/it.count.du); setIf(it,'ct',p,v=>it.el.textContent=it.count.pre+fmt(it.count.to*expoOut(v))+it.count.suf); }
}

/* ================= HUD ================= */
const hud=document.getElementById('hud'), capKick=document.getElementById('cap-kick'), capText=document.getElementById('cap-text'), capBand=document.getElementById('cap-band');
let capIdx=-2;
function renderHud(bt){
  const i=CAPTIONS.findIndex(c=>bt>=c.in-0.01 && bt<c.out+0.3);
  if (i!==capIdx){ capIdx=i; if(i>=0){ capKick.textContent=CAPTIONS[i].k; capText.textContent=CAPTIONS[i].t; } }
  if (i<0){ hud.style.opacity=0; return; }
  const c=CAPTIONS[i], pin=clamp((bt-c.in)/0.5), pout=clamp((bt-c.out)/0.3);
  const ein=expoOut(pin), dx={L:1,R:-1,U:0}[c.d], dy=c.d==='U'?1:0;
  // เข้าตามทิศที่กล้องพามา ออกไปทางที่กล้องจะไปต่อ (นำสายตา)
  const x=dx*220*(1-ein) - dx*260*pout*pout, y=dy*120*(1-ein) - dy*80*pout;
  hud.style.opacity=(clamp(pin*3)*(1-pout)).toFixed(3);
  hud.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;
  const wipe=(1-ein)*100; capBand.style.clipPath=`inset(0 ${c.d==='R'?0:wipe}% 0 ${c.d==='R'?wipe:0}%)`;
}

/* ================= RENDER ================= */
const lens=document.getElementById('lens'), blurEl=document.getElementById('mb-blur'), flashEl=document.getElementById('flash'),
      progEl=document.getElementById('progress'), endEl=document.getElementById('endfade'), dbg=document.getElementById('debug');
let lastBlur='';
function render(t){
  const bt=t/B;
  const c=cam(bt);
  world.style.transform=`translate(${SW/2}px,${SH/2}px) rotate(${c.r.toFixed(3)}deg) scale(${c.s.toFixed(5)}) translate(${(-c.x).toFixed(2)}px,${(-c.y).toFixed(2)}px)`;

  // motion blur ตามความเร็วกล้อง (ทิศทางจริงบนจอ)
  const dtb=(1/120)/B, cb=camBase(bt), p0=camBase(bt-dtb);
  const rr=c.r*Math.PI/180, dx=(p0.x-cb.x)*cb.s, dy=(p0.y-cb.y)*cb.s;
  const vx=(dx*Math.cos(rr)-dy*Math.sin(rr))*120, vy=(dx*Math.sin(rr)+dy*Math.cos(rr))*120;
  const zv=Math.abs(Math.log(cb.s/p0.s))*120;
  const bx=Math.min(70,Math.abs(vx)*0.0032+zv*1.0), by=Math.min(70,Math.abs(vy)*0.0032+zv*1.0);
  const key=(bx+by<3)?'none':`${bx.toFixed(1)} ${by.toFixed(1)}`;
  if (key!==lastBlur){ lastBlur=key; if(key==='none') lens.style.filter='none'; else { blurEl.setAttribute('stdDeviation',key); lens.style.filter='url(#mb)'; } }

  // วาดเฉพาะ panel ที่อยู่ในเฟรม
  const cr=Math.cos(rr), sr=Math.sin(rr), rad=c.s*1110;
  for (const p of panels){
    const ox=(p.c.x-c.x)*c.s, oy=(p.c.y-c.y)*c.s;
    const sx=ox*cr-oy*sr, sy=ox*sr+oy*cr;
    const v=Math.abs(sx)<SW/2+rad && Math.abs(sy)<SH/2+rad;
    if (v!==p.vis){ p.vis=v; p.el.style.visibility=v?'visible':'hidden'; }
    if (v) for (const it of p.items) updateItem(it,bt);
  }

  renderHud(bt);
  let f=0; for (const [b,a] of FLASH){ const d=bt-b; if(d>=0&&d<2) f+=a*Math.exp(-d*B*9); }
  flashEl.style.opacity=clamp(f).toFixed(3);
  progEl.style.width=(clamp(bt/END_BEAT)*100).toFixed(2)+'%';
  endEl.style.opacity=clamp((bt-END_BEAT-0.3)/1.2).toFixed(3);
  if (debugOn) dbg.textContent=`t ${t.toFixed(3)}s · beat ${bt.toFixed(2)} · bar ${Math.floor(bt/4)+1}.${Math.floor(bt%4)+1}`;
}

/* ================= STAGE FIT ================= */
const stage=document.getElementById('stage');
stage.style.width=SW+'px'; stage.style.height=SH+'px';
function fit(){ const s=Math.min(innerWidth/SW, innerHeight/SH); stage.style.transform=`translate(${(innerWidth-SW*s)/2}px,${(innerHeight-SH*s)/2}px) scale(${s})`; }
addEventListener('resize',fit); fit();

/* ================= AUDIO (สังเคราะห์สด 160 BPM) ================= */
let AC=null, out=null, noiseBuf=null, t0=0, events=[], evIdx=0, schedTimer=null, muted=false;
function initAudio(){
  AC=new (window.AudioContext||window.webkitAudioContext)();
  const comp=AC.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4; comp.attack.value=.003; comp.release.value=.2;
  out=AC.createGain(); out.gain.value=.85; out.connect(comp); comp.connect(AC.destination);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
}
function G(v=1){ const g=AC.createGain(); g.gain.value=v; return g; }
function envAD(g,t,peak,a,d){ g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+a+d); }
function osc(type,f,t,dur){ const o=AC.createOscillator(); o.type=type; o.frequency.setValueAtTime(f,t); o.start(t); o.stop(t+dur+.05); return o; }
function noise(t,dur){ const s=AC.createBufferSource(); s.buffer=noiseBuf; s.start(t,Math.random()*1.5,dur+.05); return s; }
function filt(type,f,q=1){ const b=AC.createBiquadFilter(); b.type=type; b.frequency.value=f; b.Q.value=q; return b; }

function kick(t){ const o=osc('sine',165,t,.4), g=G(0); o.frequency.exponentialRampToValueAtTime(44,t+.12); envAD(g,t,1,.002,.32); o.connect(g).connect(out);
  const n=noise(t,.02), f=filt('bandpass',3500,1), g2=G(0); envAD(g2,t,.25,.001,.02); n.connect(f).connect(g2).connect(out); }
function clap(t){ const n=noise(t,.25), f=filt('bandpass',1700,1.2), g=G(0); envAD(g,t,.55,.002,.18); n.connect(f).connect(g).connect(out);
  const o=osc('triangle',190,t,.1), g2=G(0); envAD(g2,t,.2,.001,.08); o.connect(g2).connect(out); }
function hat(t,open,v=1){ const n=noise(t,open?.3:.06), f=filt('highpass',8000), g=G(0); envAD(g,t,(open?.16:.09)*v,.001,open?.22:.035); n.connect(f).connect(g).connect(out); }
function bass(t,f,dur){ const o=osc('sawtooth',f,t,dur), s=osc('sine',f/2,t,dur), lp=filt('lowpass',2200,7), g=G(0);
  lp.frequency.setValueAtTime(2400,t); lp.frequency.exponentialRampToValueAtTime(220,t+dur); envAD(g,t,.32,.004,dur);
  o.connect(lp); s.connect(lp); lp.connect(g).connect(out); }
function pluck(t,f){ const o=osc('square',f,t,.14), lp=filt('lowpass',2600,2), g=G(0); envAD(g,t,.045,.002,.11); o.connect(lp).connect(g).connect(out); }
function stab(t,fs){ fs.forEach(f=>{ [-7,7].forEach(dt=>{ const o=osc('sawtooth',f,t,.35); o.detune.value=dt; const lp=filt('lowpass',3200,1), g=G(0); envAD(g,t,.05,.003,.3); o.connect(lp).connect(g).connect(out); }); }); }
function impact(t,a){ const o=osc('sine',120,t,1.4), g=G(0); o.frequency.exponentialRampToValueAtTime(30,t+.9); envAD(g,t,.9*a,.002,1.2); o.connect(g).connect(out);
  const n=noise(t,.8), lp=filt('lowpass',1400), g2=G(0); envAD(g2,t,.5*a,.002,.6); n.connect(lp).connect(g2).connect(out);
  const c=noise(t,1.6), hp=filt('highpass',5500), g3=G(0); envAD(g3,t,.22*a,.002,1.4); c.connect(hp).connect(g3).connect(out); }
function whoosh(t,dur,dir){ const n=noise(t,dur+.1), bp=filt('bandpass',400,1.4), g=G(0), pan=AC.createStereoPanner?AC.createStereoPanner():null;
  bp.frequency.setValueAtTime(300,t); bp.frequency.exponentialRampToValueAtTime(4200,t+dur*.7); bp.frequency.exponentialRampToValueAtTime(900,t+dur);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.5,t+dur*.65); g.gain.exponentialRampToValueAtTime(.0001,t+dur+.08);
  n.connect(bp).connect(g); if(pan){ pan.pan.setValueAtTime(-.8*dir,t); pan.pan.linearRampToValueAtTime(.8*dir,t+dur); g.connect(pan).connect(out); } else g.connect(out); }
function blip(t){ const o=osc('sine',1500,t,.07), g=G(0); o.frequency.exponentialRampToValueAtTime(900,t+.05); envAD(g,t,.09,.001,.05); o.connect(g).connect(out); }
function tick(t){ const n=noise(t,.02), hp=filt('highpass',4000), g=G(0); envAD(g,t,.12,.001,.015); n.connect(hp).connect(g).connect(out); }
function riser(t,dur){ const n=noise(t,dur), bp=filt('bandpass',300,3), g=G(0); bp.frequency.setValueAtTime(250,t); bp.frequency.exponentialRampToValueAtTime(8000,t+dur);
  g.gain.setValueAtTime(.01,t); g.gain.exponentialRampToValueAtTime(.4,t+dur); g.gain.setValueAtTime(.0001,t+dur+.01); n.connect(bp).connect(g).connect(out);
  const o=osc('sawtooth',110,t,dur), lp=filt('lowpass',1800), g2=G(0); o.frequency.exponentialRampToValueAtTime(880,t+dur);
  g2.gain.setValueAtTime(.0001,t); g2.gain.exponentialRampToValueAtTime(.07,t+dur); g2.gain.setValueAtTime(.0001,t+dur+.01); o.connect(lp).connect(g2).connect(out); }
function pad(t,dur){ [220,261.63,329.63,440].forEach(f=>[-9,9].forEach(dt=>{ const o=osc('sawtooth',f,t,dur); o.detune.value=dt; const lp=filt('lowpass',700), g=G(0);
  lp.frequency.setValueAtTime(600,t); lp.frequency.exponentialRampToValueAtTime(2600,t+dur); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.035,t+dur*.6); g.gain.setValueAtTime(.0001,t+dur);
  o.connect(lp).connect(g).connect(out); })); }

function buildEvents(){
  const E=[], at=(b,f)=>E.push({t:sec(b),f});
  const ROOTS=[55,43.65,65.41,49];                                     // Am F C G
  const CH=[[440,523.25,659.25],[349.23,440,523.25],[523.25,659.25,783.99],[392,493.88,587.33]];
  const ARP=[0,1,2,1,2,0,1,2];
  for (let b=0;b<END_BEAT;b++){
    const brk=b>=124&&b<130, bar=Math.floor(b/4)%4, root=ROOTS[bar];
    if (!brk){ at(b,kick); if(b%2===1) at(b,clap); }
    for (let k=0;k<4;k++){ if(brk && k%2) continue; const v=brk?.5+(b-124)/12:1; at(b+k/4,T=>hat(T,k===2,v)); }
    if (!brk){ at(b+.5,T=>bass(T,root,.16)); at(b+.75,T=>bass(T,root*2,.1)); if(b%4===3) at(b+.25,T=>bass(T,root*1.5,.1)); }
    if (!brk && b>=8) for (let k=0;k<4;k++){ const n=CH[bar][ARP[((b%2)*4+k)%8]]; at(b+k/4,T=>pluck(T,n*(k===3?2:1))); }
  }
  // stab ทุกต้นห้องของแต่ละฉาก
  [0,8,20,28,36,46,56,68,76,88,94,100,110,118,130].forEach(b=>at(b,T=>stab(T,CH[Math.floor(b/4)%4].map(f=>f/2))));
  IMPACTS.forEach(([b,a])=>at(b,T=>impact(T,a)));
  BLIPS.forEach(b=>at(b,blip));
  TYPES.forEach(([b,r,n])=>{ for(let i=0;i<n;i++) at(b+i*r,tick); });
  at(124.9,T=>riser(T,sec(130-124.9)));
  at(124.9,T=>pad(T,sec(130-124.9)));
  // whoosh อัตโนมัติจากทุกการเคลื่อนกล้องแบบ whip / snap
  for (let i=1;i<KEYS.length;i++){ const a=KEYS[i-1], z=KEYS[i]; if(z.e!=='whip'&&z.e!=='snap') continue;
    const dir=Math.sign(z.x-a.x)||1, dur=sec(z.b-a.b); at(a.b,T=>whoosh(T,Math.max(.12,dur),dir)); }
  return E.sort((p,q)=>p.t-q.t);
}

/* ================= CLOCK / TRANSPORT ================= */
let debugOn=params.has('debug'), playing=false, paused=false, clockBase=0, clockStart=0, frozenT=null;
const latency=()=>AC?((AC.outputLatency||0)+(AC.baseLatency||0)):0;
function now(){
  if (frozenT!=null) return frozenT;
  if (AC && !muted) return AC.currentTime-t0-latency();
  return paused?clockBase:clockBase+(performance.now()-clockStart)/1000;
}
function scheduler(){
  const horizon=AC.currentTime-t0+.2;
  while (evIdx<events.length && events[evIdx].t<horizon){ const e=events[evIdx++]; const T=t0+e.t; if(T>=AC.currentTime-.02) e.f(Math.max(T,AC.currentTime)); }
}
function loop(){
  if (!playing) return;
  const t=now(); render(t);
  if (t/B>END_BEAT+2){ playing=false; document.getElementById('end').classList.remove('hidden'); return; }
  requestAnimationFrame(loop);
}
function start(withAudio){
  document.getElementById('gate').classList.add('hidden'); document.getElementById('end').classList.add('hidden');
  frozenT=null; capIdx=-2; playing=true; paused=false;
  if (withAudio){
    try{
      if(!AC) initAudio(); if(AC.state==='suspended') AC.resume();
      events=buildEvents(); evIdx=0; t0=AC.currentTime+.12; muted=false;
      clearInterval(schedTimer); schedTimer=setInterval(scheduler,25); scheduler();
    }catch(e){ console.warn('audio unavailable',e); muted=true; }
  } else muted=true;
  clockBase=withAudio&&!muted?0:-0.12; clockStart=performance.now();
  requestAnimationFrame(loop);
}
document.getElementById('play-btn').addEventListener('click',()=>start(true));
document.getElementById('replay-btn').addEventListener('click',()=>start(!muted));

addEventListener('keydown',e=>{
  if (e.key==='d'||e.key==='D'){ debugOn=!debugOn; dbg.style.display=debugOn?'block':'none'; render(now()); }
  if (e.key==='m'||e.key==='M'){ if(AC){ out.gain.value = out.gain.value>0 ? 0 : .85; } }
  if (e.code==='Space' && playing){ e.preventDefault();
    if (!paused){ paused=true; if(AC&&!muted) AC.suspend(); else clockBase=now(); }
    else { paused=false; if(AC&&!muted) AC.resume(); else clockStart=performance.now(); } }
  if ((e.key==='ArrowRight'||e.key==='ArrowLeft') && (frozenT!=null||paused)){
    const step=(e.shiftKey?B:1/30)*(e.key==='ArrowRight'?1:-1);
    frozenT=Math.max(0,now()+step); render(frozenT); }
});

// โหมดรีวิว: ?t=วินาที หรือ ?b=บีต → ค้างเฟรมนั้น (ใช้ ←/→ เลื่อนทีละเฟรม)
window.__render=render; window.__B=B; window.__CAPTIONS=CAPTIONS; window.__KEYS=KEYS;
if (params.has('t')||params.has('b')){
  document.getElementById('gate').classList.add('hidden');
  frozenT=params.has('t')?+params.get('t'):sec(+params.get('b'));
  if (debugOn) dbg.style.display='block';
  const draw=()=>render(frozenT); draw(); document.fonts&&document.fonts.ready.then(draw);
} else if (params.has('autoplay')){
  start(false);
} else {
  render(0);
}
if (debugOn) dbg.style.display='block';

// ตรวจความยาวคำบรรยาย: ต้องค้างบนจอนานพอให้อ่านทัน (0.6s + 45ms/ตัวอักษร)
CAPTIONS.forEach(c=>{ const need=.6+.045*graphemes(c.t).length, have=sec(c.out-c.in); if(have<need) console.warn('caption too short',c.t,have.toFixed(2),'<',need.toFixed(2)); });
</script>
